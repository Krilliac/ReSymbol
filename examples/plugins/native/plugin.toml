manifest_version = 1
id = "dev.resymbol.example.native-rtti"
name = "Example Native RTTI Resolver"
version = "0.1.0"
api = "^0.1.0"
description = "Native C ABI manifest with compile-time recovery-claim helper usage."
capabilities = ["analyzer.rtti", "resolver.symbols"]
permissions = ["binary.read", "claims.submit"]

[runtime]
kind = "native"
entrypoint = "example-native-rtti.dll"
isolation = "out-of-process"

# Native plugins use the dedicated plugin-host process. The current host does
# not implement in-process loading, even for manifests that declare it.
# claim_contract_example.c demonstrates the additive protocol-1 helper types;
# cpp_exception_safe_plugin.cpp demonstrates the complete C++11 lifecycle;
# native claim submission remains strict UTF-8 JSON through the C host callback.
