name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  contracts:
    name: Plugin contracts and fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate native C and C++ header
        run: |
          echo '#include <resymbol_plugin.h>' | cc -x c -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only -Isdk/native/include -
          echo '#include <resymbol_plugin.h>' | c++ -x c++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsyntax-only -Isdk/native/include -
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isdk/native/include -c examples/plugins/native/claim_contract_example.c -o /tmp/resymbol-native-contract-c.o
          c++ -x c++ -std=c++11 -Wall -Wextra -Werror -pedantic -Isdk/native/include -c examples/plugins/native/claim_contract_example.c -o /tmp/resymbol-native-contract-cpp.o
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -Isdk/native/include -c examples/plugins/native/cpp_exception_safe_plugin.cpp -o /tmp/resymbol-native-exception-safe-cpp11.o
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Isdk/native/include -c examples/plugins/native/cpp_exception_safe_plugin.cpp -o /tmp/resymbol-native-exception-safe-cpp17.o
          c++ -std=c++11 -fno-exceptions -Wall -Wextra -Werror -pedantic -Isdk/native/include -c examples/plugins/native/cpp_exception_safe_plugin.cpp -o /tmp/resymbol-native-exception-safe-no-exceptions.o
          c++ -std=c++11 -shared -fPIC -fvisibility=hidden -Wall -Wextra -Werror -pedantic -Isdk/native/include examples/plugins/native/cpp_exception_safe_plugin.cpp -o /tmp/resymbol-native-exception-safe.so
          nm -D --defined-only /tmp/resymbol-native-exception-safe.so | awk '$3 == "resymbol_plugin_get_api" { found = 1 } END { exit !found }'
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -Isdk/native/include -c sdk/native/tests/cpp_noexcept_contract.cpp -o /tmp/resymbol-native-noexcept-contract-cpp11.o
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Isdk/native/include -c sdk/native/tests/cpp_noexcept_contract.cpp -o /tmp/resymbol-native-noexcept-contract-cpp17.o

      - name: Validate process protocol JSON
        run: jq empty protocol/plugin-wire.schema.json

      - name: Install Rust target for the WASM example
        run: rustup target add wasm32-unknown-unknown

      - name: Rebuild source-backed WASM component
        run: bash examples/plugins/wasm/build.sh

      - name: Verify checked-in WASM component is reproducible
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch \
            examples/plugins/wasm/Cargo.lock \
            examples/plugins/wasm/example-resolver.wasm >/dev/null
          git diff --exit-code -- \
            examples/plugins/wasm/Cargo.lock \
            examples/plugins/wasm/example-resolver.wasm

      - name: Rebuild adversarial WASM runtime fixture
        run: >-
          bash
          crates/resymbol-plugin-runtime/tests/fixtures/wasm-violations/build.sh

      - name: Verify adversarial WASM fixture is reproducible
        shell: bash
        run: |
          set -euo pipefail
          fixture="crates/resymbol-plugin-runtime/tests/fixtures/wasm-violations"
          git ls-files --error-unmatch \
            "${fixture}/Cargo.lock" \
            "${fixture}/component.wasm" >/dev/null
          git diff --exit-code -- \
            "${fixture}/Cargo.lock" \
            "${fixture}/component.wasm"

      - name: Run real WASM drop-in through the exact CLI
        shell: bash
        run: |
          set -euo pipefail
          staged="${RUNNER_TEMP}/resymbol-wasm-e2e-plugin"
          mkdir -p "$staged"
          cp examples/plugins/wasm/plugin.toml "$staged/"
          cp examples/plugins/wasm/example-resolver.wasm "$staged/"
          cargo build --locked --bin resymbol
          export RESYMBOL_WASM_E2E_PLUGIN_DIR="$(realpath "$staged")"
          export RESYMBOL_WASM_E2E_CLI="$(realpath target/debug/resymbol)"
          cargo test --locked -p resymbol-cli --test wasm_cli_drop_in -- \
            --ignored --exact real_wasm_cli_drop_in_round_trip --nocapture

  fixture-corpus:
    name: Rebuild MSVC fixture corpus
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable MSVC developer tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: 14.44.35207
          vsversion: 2022

      - name: Rebuild and verify checked-in PE fixtures
        shell: pwsh
        run: >-
          ./tools/build-analysis-fixtures.ps1
          -CheckDeterminism
          -VerifyCheckedIn

  rust:
    name: Rust (${{ matrix.os-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Linux
          - os: windows-latest
            os-name: Windows
          - os: macos-latest
            os-name: macOS
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable MSVC developer tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Verify decoder profiles without optional backends
        if: runner.os == 'Linux'
        run: >-
          cargo test --locked -p resymbol-analysis
          --test decoder_profiles --test ps2_ee_r5900_core_v1
          --test ps2_ee_r5900_core_v1_mmi_word_shift_v1
          --test ps2_ee_r5900_core_v1_mmi_word_shift_v1_packed_logical_v1
          --test ps2_ee_r5900_core_v1_mmi_word_shift_v1_packed_logical_v1_packed_add_v1
          --test ps2_ee_r5900_core_v1_mmi_word_shift_v1_packed_logical_v1_packed_add_v1_packed_sub_v1
          --test ps2_ee_r5900_core_v1_mmi_word_shift_v1_packed_logical_v1_packed_add_v1_packed_sub_v1_packed_compare_gt_v1
          --no-default-features

      - name: Build CLI and disposable native host
        run: cargo build --locked --bin resymbol --bin resymbol-native-host

      - name: Smoke-test C11 and C++11 native plugins
        if: runner.os != 'Windows'
        run: >-
          python3 sdk/native/tests/smoke_host.py
          --host target/debug/resymbol-native-host
          --resymbol target/debug/resymbol
          --cc cc --cxx c++ --compiler-style unix

      - name: Smoke-test C and C++ native plugins with MSVC
        if: runner.os == 'Windows'
        run: >-
          python sdk/native/tests/smoke_host.py
          --host target/debug/resymbol-native-host.exe
          --resymbol target/debug/resymbol.exe
          --cc cl --cxx cl --compiler-style msvc
