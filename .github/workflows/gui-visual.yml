name: GUI visual review captures

on:
  push:
    branches: [main]
    paths:
      - "crates/resymbol-analysis/**"
      - "crates/resymbol-app/**"
      - "crates/resymbol-core/**"
      - "crates/resymbol-debugger/**"
      - "crates/resymbol-export/**"
      - "crates/resymbol-package/**"
      - "crates/resymbol-workbench/**"
      - "fixtures/pe-x64-msvc/**"
      - "tools/capture-workbench.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gui-visual.yml"
  pull_request:
    paths:
      - "crates/resymbol-analysis/**"
      - "crates/resymbol-app/**"
      - "crates/resymbol-core/**"
      - "crates/resymbol-debugger/**"
      - "crates/resymbol-export/**"
      - "crates/resymbol-package/**"
      - "crates/resymbol-workbench/**"
      - "fixtures/pe-x64-msvc/**"
      - "tools/capture-workbench.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gui-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  capture:
    name: Regenerate deterministic Windows workbench views
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build screenshot workbench
        run: >-
          cargo build --locked
          -p resymbol-workbench
          --features screenshot
          --bin resymbol-workbench

      - name: Provision pinned software OpenGL for capture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "26.0.3"
          $expectedSha256 = "de1ec45c906164de2c046288a8969e83cf2d51d031dc8dfd1f9371bb31cd6755"
          $archive = Join-Path $env:RUNNER_TEMP "mesa3d-$version-release-msvc.7z"
          $stage = Join-Path $env:RUNNER_TEMP "mesa3d-$version"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Mesa archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip was not found at '$sevenZip'"
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          & $sevenZip e -y "-o$stage" $archive "x64\opengl32.dll" "x64\libgallium_wgl.dll"
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to extract the Mesa runtime (exit code $LASTEXITCODE)"
          }

          $binaryDirectory = (Resolve-Path -LiteralPath "target\debug").Path
          foreach ($library in @("opengl32.dll", "libgallium_wgl.dll")) {
            $source = Join-Path $stage $library
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Mesa archive did not contain x64/$library"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $binaryDirectory $library)
          }
          [IO.File]::WriteAllText(
            (Join-Path $binaryDirectory "resymbol-workbench.exe.local"),
            ""
          )

      - name: Capture and validate review views
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          ./tools/capture-workbench.ps1
          -SkipBuild
          -OutputDirectory "${{ runner.temp }}/workbench-captures"

      # Human-reviewed references live under docs/images. CI regenerates review artifacts and
      # validates format, dimensions, completeness, and manifest metadata, but intentionally does
      # not pixel-compare them or claim rendering equivalence.
      - name: Upload workbench captures
        uses: actions/upload-artifact@v4
        with:
          name: workbench-visual-captures-${{ github.sha }}
          path: ${{ runner.temp }}/workbench-captures
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
