[package]
name = "resymbol-cli"
description = "Command-line interface for ReSymbol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "resymbol"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
resymbol-analysis = { path = "../resymbol-analysis" }
resymbol-core = { path = "../resymbol-core" }
resymbol-export = { path = "../resymbol-export" }
resymbol-package = { path = "../resymbol-package" }
resymbol-plugin-runtime = { path = "../resymbol-plugin-runtime" }
resymbol-plugin-state = { path = "../resymbol-plugin-state" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
