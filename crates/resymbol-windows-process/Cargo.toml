[package]
name = "resymbol-windows-process"
description = "Narrow Windows process-containment and console-bootstrap boundaries for ReSymbol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
containment-test-fixture = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.20.0"

[[bin]]
name = "resymbol-windows-process-fixture"
path = "tests/fixtures/contained_child.rs"
required-features = ["containment-test-fixture"]
test = false
bench = false

# This crate is the deliberately narrow exception to the workspace's blanket
# unsafe-code prohibition. Its safe API owns every Win32 handle and confines
# STARTUPINFOEX/CreateProcessW invariants to one module.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
