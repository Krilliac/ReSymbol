name: Prerelease

on:
  push:
    tags:
      # Release builds are intentionally limited to SemVer prerelease tags such as
      # v0.1.0-alpha.1. Stable tags can get a separate promotion policy later.
      - "v[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate prerelease version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "Expected a SemVer prerelease tag such as v0.1.0-alpha.1; got: $RELEASE_TAG" >&2
            exit 1
          fi

          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tagged_version="${RELEASE_TAG#v}"
          if [[ "$workspace_version" != "$tagged_version" ]]; then
            echo "Tag version $tagged_version does not match workspace version $workspace_version" >&2
            exit 1
          fi

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Rust target for the WASM example
        run: rustup target add wasm32-unknown-unknown

      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev
          libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev
          libegl1-mesa-dev libwayland-dev

      - name: Rebuild and verify source-backed WASM component
        shell: bash
        run: |
          set -euo pipefail
          bash examples/plugins/wasm/build.sh
          git ls-files --error-unmatch \
            examples/plugins/wasm/Cargo.lock \
            examples/plugins/wasm/example-resolver.wasm >/dev/null
          git diff --exit-code -- \
            examples/plugins/wasm/Cargo.lock \
            examples/plugins/wasm/example-resolver.wasm

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore managed-host tests
        run: >-
          dotnet restore
          sdk/dotnet/ReSymbol.ManagedHost.Tests/ReSymbol.ManagedHost.Tests.csproj
          --nologo

      - name: Build managed-host tests
        run: >-
          dotnet build
          sdk/dotnet/ReSymbol.ManagedHost.Tests/ReSymbol.ManagedHost.Tests.csproj
          --configuration Release
          --no-restore
          --nologo
          --verbosity minimal
          -warnaserror
          -m:1

      - name: Run managed-host tests
        run: >-
          dotnet run
          --project sdk/dotnet/ReSymbol.ManagedHost.Tests/ReSymbol.ManagedHost.Tests.csproj
          --configuration Release
          --no-build

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            helper_target: x86_64-pc-windows-msvc
            workbench_target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
            executable: resymbol.exe
            helper_executable: resymbol-native-host.exe
            workbench_executable: resymbol-workbench.exe
            managed_rid: win-x64
            managed_executable: resymbol-managed-host.exe
            archive: zip
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-musl
            # The static musl CLI stays maximally portable. Native plugins are
            # ordinary GNU/glibc .so files, so their disposable loader is GNU.
            helper_target: x86_64-unknown-linux-gnu
            workbench_target: x86_64-unknown-linux-gnu
            rustflags: ""
            executable: resymbol
            helper_executable: resymbol-native-host
            workbench_executable: resymbol-workbench
            managed_rid: linux-x64
            managed_executable: resymbol-managed-host
            archive: tar.gz
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            helper_target: x86_64-apple-darwin
            workbench_target: x86_64-apple-darwin
            rustflags: ""
            executable: resymbol
            helper_executable: resymbol-native-host
            workbench_executable: resymbol-workbench
            managed_rid: osx-x64
            managed_executable: resymbol-managed-host
            archive: tar.gz
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            helper_target: aarch64-apple-darwin
            workbench_target: aarch64-apple-darwin
            rustflags: ""
            executable: resymbol
            helper_executable: resymbol-native-host
            workbench_executable: resymbol-workbench
            managed_rid: osx-arm64
            managed_executable: resymbol-managed-host
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      HELPER_TARGET: ${{ matrix.helper_target }}
      WORKBENCH_TARGET: ${{ matrix.workbench_target }}
      PLATFORM: ${{ matrix.platform }}
      MANAGED_RID: ${{ matrix.managed_rid }}
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Enable MSVC developer tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust target
        run: |
          rustup target add "$TARGET"
          if [[ "$HELPER_TARGET" != "$TARGET" ]]; then
            rustup target add "$HELPER_TARGET"
          fi
          if [[ "$WORKBENCH_TARGET" != "$TARGET" && "$WORKBENCH_TARGET" != "$HELPER_TARGET" ]]; then
            rustup target add "$WORKBENCH_TARGET"
          fi
        shell: bash

      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            musl-tools pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev \
            libegl1-mesa-dev libwayland-dev

      - name: Build release executables
        run: cargo build --locked --release --target "$TARGET" --bin resymbol
        shell: bash

      - name: Build native workbench
        run: >-
          cargo build --locked --release --target "$WORKBENCH_TARGET"
          --bin resymbol-workbench
        shell: bash

      - name: Build disposable native helper
        run: >-
          cargo build --locked --release --target "$HELPER_TARGET"
          --bin resymbol-native-host
        shell: bash

      - name: Publish disposable managed helper
        shell: bash
        run: |
          set -euo pipefail
          tagged_version="${RELEASE_TAG#v}"
          publish_dir="target/managed/${MANAGED_RID}/publish"
          dotnet restore \
            sdk/dotnet/ReSymbol.ManagedHost/ReSymbol.ManagedHost.csproj \
            --runtime "$MANAGED_RID" \
            --nologo
          dotnet publish \
            sdk/dotnet/ReSymbol.ManagedHost/ReSymbol.ManagedHost.csproj \
            --configuration Release \
            --runtime "$MANAGED_RID" \
            --self-contained true \
            --no-restore \
            --output "$publish_dir" \
            -p:Version="$tagged_version" \
            -p:InformationalVersion="$tagged_version" \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -p:ContinuousIntegrationBuild=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:PublishReadyToRun=false \
            -p:PublishAot=false \
            -p:EnableCompressionInSingleFile=false \
            -p:DebugSymbols=false \
            -p:DebugType=None

      - name: Restore and build managed release example
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore \
            examples/plugins/managed/Example.ManagedMatcher.csproj \
            --nologo
          dotnet build \
            examples/plugins/managed/Example.ManagedMatcher.csproj \
            --configuration Release \
            --no-restore \
            --nologo \
            --verbosity minimal \
            -warnaserror \
            -m:1 \
            -p:ContinuousIntegrationBuild=true

      - name: Stage managed release example
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildOutput = "examples/plugins/managed/bin/Release/net8.0"
          $entryAssembly = Join-Path $buildOutput "Example.ManagedMatcher.dll"
          if (-not (Test-Path -LiteralPath $entryAssembly -PathType Leaf)) {
            throw "Managed example entry assembly was not built: $entryAssembly"
          }
          $privateSdk = @(Get-ChildItem -LiteralPath $buildOutput -File -Recurse |
            Where-Object { $_.Name -ieq "ReSymbol.PluginSdk.dll" })
          if ($privateSdk.Count -ne 0) {
            throw "Managed example copied a private SDK: $($privateSdk.FullName -join ', ')"
          }

          $staged = "target/managed-release-e2e/$env:MANAGED_RID/plugin"
          New-Item -ItemType Directory -Path $staged -Force | Out-Null
          Copy-Item -LiteralPath $entryAssembly -Destination $staged
          Copy-Item -LiteralPath "examples/plugins/managed/plugin.toml" -Destination $staged

      - name: Stage WASM release example
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staged = "target/wasm-release-e2e/plugin"
          New-Item -ItemType Directory -Path $staged -Force | Out-Null
          Copy-Item -LiteralPath "examples/plugins/wasm/plugin.toml" -Destination $staged
          Copy-Item -LiteralPath "examples/plugins/wasm/example-resolver.wasm" -Destination $staged

          $files = @(Get-ChildItem -LiteralPath $staged -File)
          if ($files.Count -ne 2) {
            throw "Expected the staged WASM plugin to contain two files; found: $($files.Name -join ', ')"
          }

      - name: Smoke-test executable
        if: runner.os != 'Windows'
        run: |
          "./target/${TARGET}/release/resymbol" --version
          "./target/${WORKBENCH_TARGET}/release/${{ matrix.workbench_executable }}" --version
          "./target/${HELPER_TARGET}/release/${{ matrix.helper_executable }}" --version
        shell: bash

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        run: |
          & "target/$env:TARGET/release/resymbol.exe" --version
          & "target/$env:WORKBENCH_TARGET/release/${{ matrix.workbench_executable }}" --version
          & "target/$env:HELPER_TARGET/release/${{ matrix.helper_executable }}" --version
        shell: pwsh

      - name: Run exact release WASM CLI drop-in integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pluginPath = "target/wasm-release-e2e/plugin"
          $cliPath = "target/$env:TARGET/release/${{ matrix.executable }}"
          $env:RESYMBOL_WASM_E2E_PLUGIN_DIR = (Resolve-Path -LiteralPath $pluginPath).Path
          $env:RESYMBOL_WASM_E2E_CLI = (Resolve-Path -LiteralPath $cliPath).Path

          & cargo test --locked -p resymbol-cli --test wasm_cli_drop_in -- `
            --ignored --exact real_wasm_cli_drop_in_round_trip --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "Exact release WASM CLI drop-in integration failed"
          }

      - name: Relocate and smoke-test managed helper
        shell: pwsh
        env:
          MANAGED_EXECUTABLE: ${{ matrix.managed_executable }}
        run: |
          $ErrorActionPreference = "Stop"
          $publishDirectory = "target/managed/$env:MANAGED_RID/publish"
          $published = @(Get-ChildItem -LiteralPath $publishDirectory -File)
          if ($published.Count -ne 1 -or $published[0].Name -ne $env:MANAGED_EXECUTABLE) {
            throw "Expected one self-contained managed helper; found: $($published.Name -join ', ')"
          }

          $relocation = Join-Path ([IO.Path]::GetTempPath()) ("resymbol-managed-release-" + [Guid]::NewGuid())
          $extraction = Join-Path $relocation "bundle-extract"
          New-Item -ItemType Directory -Path $extraction -Force | Out-Null
          if (-not $IsWindows) {
            & chmod 700 $relocation $extraction
            if ($LASTEXITCODE -ne 0) { throw "chmod failed" }
          }

          $relocatedHost = Join-Path $relocation $env:MANAGED_EXECUTABLE
          Copy-Item -LiteralPath $published[0].FullName -Destination $relocatedHost
          if (-not $IsWindows) {
            & chmod 700 $relocatedHost
            if ($LASTEXITCODE -ne 0) { throw "chmod failed" }
          }

          $env:DOTNET_ROOT = Join-Path $relocation "missing-dotnet-root"
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = $extraction
          $version = (& $relocatedHost --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "relocated managed helper failed" }
          $expected = "resymbol-managed-host $($env:RELEASE_TAG.Substring(1))"
          if ($version -ne $expected) {
            throw "Unexpected managed-helper version: $version"
          }

          Remove-Item -LiteralPath $relocation -Recurse -Force

      - name: Run exact release managed process integration
        shell: pwsh
        env:
          MANAGED_EXECUTABLE: ${{ matrix.managed_executable }}
        run: |
          $ErrorActionPreference = "Stop"
          $hostPath = Join-Path "target/managed/$env:MANAGED_RID/publish" $env:MANAGED_EXECUTABLE
          $pluginPath = "target/managed-release-e2e/$env:MANAGED_RID/plugin"
          $env:RESYMBOL_MANAGED_E2E_HOST = (Resolve-Path -LiteralPath $hostPath).Path
          $env:RESYMBOL_MANAGED_E2E_PLUGIN_DIR = (Resolve-Path -LiteralPath $pluginPath).Path

          & cargo test --locked -p resymbol-plugin-runtime --test managed_process -- `
            --ignored --exact real_managed_process_round_trip --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "Exact release managed-process integration failed"
          }

      - name: Run exact release managed CLI drop-in integration
        shell: pwsh
        env:
          MANAGED_EXECUTABLE: ${{ matrix.managed_executable }}
        run: |
          $ErrorActionPreference = "Stop"
          $hostPath = Join-Path "target/managed/$env:MANAGED_RID/publish" $env:MANAGED_EXECUTABLE
          $pluginPath = "target/managed-release-e2e/$env:MANAGED_RID/plugin"
          $cliPath = "target/$env:TARGET/release/${{ matrix.executable }}"
          $env:RESYMBOL_MANAGED_E2E_HOST = (Resolve-Path -LiteralPath $hostPath).Path
          $env:RESYMBOL_MANAGED_E2E_PLUGIN_DIR = (Resolve-Path -LiteralPath $pluginPath).Path
          $env:RESYMBOL_MANAGED_E2E_CLI = (Resolve-Path -LiteralPath $cliPath).Path

          & cargo test --locked -p resymbol-cli --test managed_cli_drop_in -- `
            --ignored --exact real_managed_cli_drop_in_round_trip --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "Exact release managed CLI drop-in integration failed"
          }

      - name: Verify Windows executables do not require the dynamic MSVC runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binaries = @(
            "target/$env:TARGET/release/${{ matrix.executable }}",
            "target/$env:WORKBENCH_TARGET/release/${{ matrix.workbench_executable }}",
            "target/$env:HELPER_TARGET/release/${{ matrix.helper_executable }}"
          )
          foreach ($binary in $binaries) {
            $dependencies = (& dumpbin /NOLOGO /DEPENDENTS $binary | Out-String)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $binary"
            }
            if ($dependencies -match '(?im)^\s*(VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt)[^\s]*\.dll\s*$') {
              throw "$binary still depends on a dynamic MSVC/UCRT library`n$dependencies"
            }
          }

      - name: Package Unix archive and checksum
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          package_root="resymbol-${RELEASE_TAG}-${PLATFORM}"
          stage="dist/${package_root}"
          mkdir -p "${stage}/plugins" "${stage}/docs"
          cp "target/${TARGET}/release/${{ matrix.executable }}" "${stage}/"
          cp "target/${WORKBENCH_TARGET}/release/${{ matrix.workbench_executable }}" "${stage}/"
          cp "target/${HELPER_TARGET}/release/${{ matrix.helper_executable }}" "${stage}/"
          cp "target/managed/${MANAGED_RID}/publish/${{ matrix.managed_executable }}" "${stage}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${stage}/"
          cp -R docs/. "${stage}/docs/"
          cp packaging/plugins/README.txt "${stage}/plugins/"
          wasm_plugin="${stage}/plugins/dev.resymbol.example.wasm-resolver"
          mkdir -p "$wasm_plugin"
          cp examples/plugins/wasm/plugin.toml "$wasm_plugin/"
          cp examples/plugins/wasm/example-resolver.wasm "$wasm_plugin/"

          archive="dist/${package_root}.tar.gz"
          tar -C dist -czf "$archive" "$package_root"
          (
            cd dist
            shasum -a 256 "${package_root}.tar.gz" > "${package_root}.tar.gz.sha256"
          )

      - name: Package Windows archive and checksum
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = "resymbol-$env:RELEASE_TAG-$env:PLATFORM"
          $stage = Join-Path "dist" $packageRoot
          New-Item -ItemType Directory -Path (Join-Path $stage "plugins") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $stage "docs") -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/${{ matrix.executable }}" $stage
          Copy-Item "target/$env:WORKBENCH_TARGET/release/${{ matrix.workbench_executable }}" $stage
          Copy-Item "target/$env:HELPER_TARGET/release/${{ matrix.helper_executable }}" $stage
          Copy-Item "target/managed/$env:MANAGED_RID/publish/${{ matrix.managed_executable }}" $stage
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage
          Copy-Item docs/* (Join-Path $stage "docs") -Recurse
          Copy-Item packaging/plugins/README.txt (Join-Path $stage "plugins")
          $wasmPlugin = Join-Path $stage "plugins/dev.resymbol.example.wasm-resolver"
          New-Item -ItemType Directory -Path $wasmPlugin -Force | Out-Null
          Copy-Item examples/plugins/wasm/plugin.toml $wasmPlugin
          Copy-Item examples/plugins/wasm/example-resolver.wasm $wasmPlugin

          $archive = Join-Path "dist" "$packageRoot.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageRoot.zip" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  managed-sdk:
    name: Package managed plugin SDK
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore managed plugin SDK
        run: >-
          dotnet restore
          sdk/dotnet/ReSymbol.PluginSdk/ReSymbol.PluginSdk.csproj
          --nologo

      - name: Build and pack managed plugin SDK
        shell: bash
        run: |
          set -euo pipefail
          tagged_version="${RELEASE_TAG#v}"
          dotnet build \
            sdk/dotnet/ReSymbol.PluginSdk/ReSymbol.PluginSdk.csproj \
            --configuration Release \
            --no-restore \
            --nologo \
            --verbosity minimal \
            -warnaserror \
            -m:1 \
            -p:Version="$tagged_version" \
            -p:PackageVersion="$tagged_version" \
            -p:ContinuousIntegrationBuild=true
          dotnet pack \
            sdk/dotnet/ReSymbol.PluginSdk/ReSymbol.PluginSdk.csproj \
            --configuration Release \
            --no-build \
            --nologo \
            --output artifacts/managed-sdk \
            -m:1 \
            -p:Version="$tagged_version" \
            -p:PackageVersion="$tagged_version" \
            -p:ContinuousIntegrationBuild=true

      - name: Verify compile-only SDK package and consumer
        shell: bash
        run: |
          set -euo pipefail
          tagged_version="${RELEASE_TAG#v}"
          bash sdk/dotnet/ReSymbol.PluginSdk/verify-package.sh \
            "artifacts/managed-sdk/ReSymbol.PluginSdk.${tagged_version}.nupkg" \
            "$tagged_version"

      - name: Create managed SDK checksum
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/managed-sdk
          package="ReSymbol.PluginSdk.${RELEASE_TAG#v}.nupkg"
          sha256sum "$package" > "$package.sha256"

      - name: Upload managed SDK release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-managed-sdk
          path: |
            artifacts/managed-sdk/*.nupkg
            artifacts/managed-sdk/*.nupkg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub prerelease
    needs: [build, managed-sdk]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          # Four platform archives plus checksums and one managed SDK package plus checksum.
          # The portable WASM example is staged inside each archive, not published as a new asset.
          if [[ "${#assets[@]}" -ne 10 ]]; then
            printf 'Expected 10 release assets, found %s:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check ./*.sha256
          )

      - name: Create or update GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ReSymbol $RELEASE_TAG" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ReSymbol $RELEASE_TAG" \
              --prerelease \
              --generate-notes
          fi

          mapfile -t published_assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
          for published_asset in "${published_assets[@]}"; do
            desired=false
            for asset_path in release-assets/*; do
              if [[ "${asset_path##*/}" == "$published_asset" ]]; then
                desired=true
                break
              fi
            done
            if [[ "$desired" != true ]]; then
              gh release delete-asset "$RELEASE_TAG" "$published_asset" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            fi
          done

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
