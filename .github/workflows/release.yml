name: Prerelease

on:
  push:
    tags:
      # Release builds are intentionally limited to SemVer prerelease tags such as
      # v0.1.0-alpha.1. Stable tags can get a separate promotion policy later.
      - "v[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate prerelease version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "Expected a SemVer prerelease tag such as v0.1.0-alpha.1; got: $RELEASE_TAG" >&2
            exit 1
          fi

          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tagged_version="${RELEASE_TAG#v}"
          if [[ "$workspace_version" != "$tagged_version" ]]; then
            echo "Tag version $tagged_version does not match workspace version $workspace_version" >&2
            exit 1
          fi

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            executable: resymbol.exe
            archive: zip
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-musl
            executable: resymbol
            archive: tar.gz
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            executable: resymbol
            archive: tar.gz
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            executable: resymbol
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Rust target
        run: rustup target add "$TARGET"
        shell: bash

      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release executable
        run: cargo build --locked --release --target "$TARGET" --bin resymbol
        shell: bash

      - name: Smoke-test executable
        if: runner.os != 'Windows'
        run: "./target/${TARGET}/release/resymbol --version"
        shell: bash

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        run: "& \"target/$env:TARGET/release/resymbol.exe\" --version"
        shell: pwsh

      - name: Package Unix archive and checksum
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          package_root="resymbol-${RELEASE_TAG}-${PLATFORM}"
          stage="dist/${package_root}"
          mkdir -p "${stage}/plugins" "${stage}/docs"
          cp "target/${TARGET}/release/${{ matrix.executable }}" "${stage}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${stage}/"
          cp docs/install.md "${stage}/docs/"
          cp packaging/plugins/README.txt "${stage}/plugins/"

          archive="dist/${package_root}.tar.gz"
          tar -C dist -czf "$archive" "$package_root"
          (
            cd dist
            shasum -a 256 "${package_root}.tar.gz" > "${package_root}.tar.gz.sha256"
          )

      - name: Package Windows archive and checksum
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = "resymbol-$env:RELEASE_TAG-$env:PLATFORM"
          $stage = Join-Path "dist" $packageRoot
          New-Item -ItemType Directory -Path (Join-Path $stage "plugins") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $stage "docs") -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/${{ matrix.executable }}" $stage
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage
          Copy-Item docs/install.md (Join-Path $stage "docs")
          Copy-Item packaging/plugins/README.txt (Join-Path $stage "plugins")

          $archive = Join-Path "dist" "$packageRoot.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageRoot.zip" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -ne 8 ]]; then
            printf 'Expected 8 release assets, found %s:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check ./*.sha256
          )

      - name: Create or update GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ReSymbol $RELEASE_TAG" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ReSymbol $RELEASE_TAG" \
              --prerelease \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
