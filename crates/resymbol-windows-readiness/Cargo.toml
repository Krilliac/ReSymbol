[package]
name = "resymbol-windows-readiness"
description = "Narrow read-only Windows sandbox capability observations for ReSymbol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

# This crate is a deliberately narrow exception to the workspace's blanket
# unsafe-code prohibition. Its safe API exposes value-only observations and
# confines the three read-only Win32 calls to one module.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
