[package]
name = "resymbol-windows-live-access"
description = "Narrow identity-bound Windows live-process memory access for ReSymbol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
live-access-test-fixture = []

[dependencies]
resymbol-core = { path = "../resymbol-core" }
resymbol-debugger = { path = "../resymbol-debugger" }
thiserror = "2.0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[[bin]]
name = "resymbol-windows-live-access-fixture"
path = "tests/fixtures/live_access_child.rs"
required-features = ["live-access-test-fixture"]
test = false
bench = false

# This crate is a deliberately narrow exception to the workspace's blanket
# unsafe-code prohibition. All Win32 FFI is confined to `windows.rs`; callers
# receive an opaque owned handle boundary with only identity-bound RVA methods.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
