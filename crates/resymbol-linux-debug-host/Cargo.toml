[package]
name = "resymbol-linux-debug-host"
description = "Linux ptrace live execution-control host for ReSymbol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Builds the checked-in child fixture and enables the ignored end-to-end
# ptrace integration test. Off by default; enabled by `--all-features`.
linux-debug-host-test-fixture = []

[dependencies]
resymbol-debugger = { path = "../resymbol-debugger" }
thiserror = "2.0.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "resymbol-linux-debug-host-fixture"
path = "tests/fixtures/debug_host_child.rs"
required-features = ["linux-debug-host-test-fixture"]
test = false
bench = false

# This crate is a deliberately narrow exception to the workspace's blanket
# unsafe-code prohibition. All ptrace/fork/exec FFI is confined to `linux.rs`;
# the worker core, breakpoint bookkeeping, and public API remain safe. The
# crate intentionally does NOT inherit `[lints] workspace = true`, so the
# workspace `unsafe_code = "forbid"` does not apply here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
