[package]
name = "resymbol-plugin-runtime"
description = "Bounded sandboxed and out-of-process plugin runtimes for ReSymbol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
resymbol-core = { path = "../resymbol-core" }
resymbol-plugin-state = { path = "../resymbol-plugin-state" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
wasmtime = { version = "=36.0.12", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
kqueue = "=1.2.0"

[target.'cfg(windows)'.dependencies]
win32job = "=2.0.3"

[dev-dependencies]
semver = "1.0.26"

[[test]]
name = "external_process"
path = "tests/external_process.rs"
harness = false

[[test]]
name = "wasm_component"
path = "tests/wasm_component.rs"
harness = false

[lints]
workspace = true
