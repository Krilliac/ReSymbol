[package]
name = "resymbol-native-host"
description = "Crash-isolated protocol-1 host for ReSymbol native plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "resymbol-native-host"
path = "src/main.rs"

[dependencies]
libloading = "0.8.8"
resymbol-core = { path = "../resymbol-core" }
resymbol-plugin-api = { path = "../resymbol-plugin-api" }
resymbol-plugin-state = { path = "../resymbol-plugin-state" }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "0.8.22"

[dev-dependencies]
tempfile = "3.20.0"

# This helper is the deliberately narrow exception to the workspace's blanket
# unsafe-code prohibition. Unsafe operations are confined to the C ABI and
# dynamic-loader modules; unsafe operations inside unsafe functions remain
# explicit and Clippy requires a safety rationale for every block.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
