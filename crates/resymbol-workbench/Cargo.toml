[package]
name = "resymbol-workbench"
description = "Desktop evidence-review workbench for ReSymbol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
screenshot = ["dep:png"]

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui_extras = { version = "=0.32.3", default-features = false }
resymbol-analysis = { path = "../resymbol-analysis" }
resymbol-app = { path = "../resymbol-app" }
resymbol-core = { path = "../resymbol-core" }
resymbol-debugger = { path = "../resymbol-debugger" }
resymbol-export = { path = "../resymbol-export" }
rfd = "=0.15.4"
png = { version = "=0.18.1", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
