manifest_version = 1
id = "dev.resymbol.example.wasm-resolver"
name = "Example WASM Symbol Resolver"
version = "0.1.0"
api = "^0.1.0"
description = "Source-backed sandboxed Component Model analyzer that verifies the DOS MZ signature."
capabilities = ["analyzer.binary", "resolver.symbols"]
permissions = ["binary.read", "claims.submit"]

[runtime]
kind = "wasm"
entrypoint = "example-resolver.wasm"

# WASM plugins receive no ambient filesystem, network, clock, or process access.
# The host links only the ReSymbol host interface (no WASI) and enforces permissions
# and lifecycle phase on each sensitive call.
# sdk/wit/resymbol-plugin.wit includes typed recovery-assertion helpers while
# protocol 1.0 continues to submit their canonical tagged claim-json form.
