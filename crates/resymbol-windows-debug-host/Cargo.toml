[package]
name = "resymbol-windows-debug-host"
description = "Thread-affine read-only Windows debug attach foundation for ReSymbol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
windows-debug-host-test-fixture = []

[dependencies]
resymbol-debugger = { path = "../resymbol-debugger" }
thiserror = "2.0.12"

[target.'cfg(windows)'.dependencies]
resymbol-windows-live-access = { path = "../resymbol-windows-live-access" }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
resymbol-core = { path = "../resymbol-core" }

[[bin]]
name = "resymbol-windows-debug-host-fixture"
path = "tests/fixtures/debug_host_child.rs"
required-features = ["windows-debug-host-test-fixture"]
test = false
bench = false

# This crate is a deliberately narrow exception to the workspace's blanket
# unsafe-code prohibition. Win32 debug-event union access and handle closure
# are confined to `windows.rs`; the worker core and public API remain safe.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
